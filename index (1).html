<!DOCTYPE html>
<html lang="ar" dir="rtl" oncontextmenu="return false;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الوصول الآمن - Raqami</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #05080a 0%, #0d081a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
    overflow: hidden;
  }
  .card {
    background: rgba(15, 12, 28, 0.95);
    backdrop-filter: blur(25px);
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 30px;
    max-width: 450px;
    width: 100%;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
    position: relative;
    z-index: 10;
  }
  .icon-wrap {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    box-shadow: 0 0 30px rgba(79, 172, 254, 0.6);
    font-size: 40px;
  }
  h1 { font-size: 26px; margin-bottom: 15px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  p.desc { font-size: 15px; color: #94a3b8; line-height: 1.7; margin-bottom: 35px; }
  .key-container {
    background: #000;
    border: 1px solid #4facfe;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 35px;
    position: relative;
  }
  .key-label { font-size: 12px; color: #4facfe; margin-bottom: 10px; font-weight: 800; letter-spacing: 2px; }
  .key-value {
    font-size: 34px;
    font-family: 'monospace';
    color: #fff;
    font-weight: 900;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
  }
  .btn {
    display: block;
    width: 100%;
    background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
    color: #000;
    text-decoration: none;
    font-size: 18px;
    font-weight: 800;
    padding: 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 242, 254, 0.5); }
  .hidden { display: none; }
  .warn-box { border-color: #ff4b2b; }
  .warn-icon { background: linear-gradient(135deg, #ff4b2b, #ff416c); box-shadow: 0 0 30px rgba(255, 75, 43, 0.5); }
</style>
<script>
  // تعطيل الاختصارات (F12, Ctrl+Shift+I, Ctrl+U)
  document.onkeydown = function(e) {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
      return false;
    }
  };

  // وظيفة التعمية المشفرة (Scrambled logic)
  var _0x5a2e=["\x52\x51\x2D","\x67\x65\x74\x46\x75\x6C\x6C\x59\x65\x61\x72","\x67\x65\x74\x4D\x6F\x6E\x74\x68","\x67\x65\x64\x44\x61\x74\x65","\x52\x51\x5F\x53\x45\x43\x55\x52\x45\x5F\x32\x30\x32\x36\x5F","\x61\x62\x73","\x72\x61\x71\x61\x6D\x69\x5F\x61\x63\x74\x69\x76\x65\x5F\x73\x65\x73\x73\x69\x6F\x6E"];
  function _generate() {
    var d=new Date();
    var y=d[_0x5a2e[1]](),m=d[_0x5a2e[2]]()+1,day=d.getDate();
    var s=(y*31)^(m*17)^(day*99);
    var t=_0x5a2e[4]+(s+1337);
    var h=0;for(var i=0;i<t.length;i++){h=((h<<5)-h)+t.charCodeAt(i);h=h&h}
    var c=Math[_0x5a2e[5]](h%900000)+100000;
    return _0x5a2e[0]+c;
  }

  function _check() {
    if(sessionStorage.getItem(_0x5a2e[6])) return false;
    var r=document.referrer||"";
    return r.indexOf("linkjust")!==-1;
  }

  window.onload = function() {
    if(_check()) {
      sessionStorage.setItem(_0x5a2e[6], "1");
      document.getElementById("v").classList.remove("hidden");
      document.getElementById("k").innerText = _generate();
    } else {
      document.getElementById("e").classList.remove("hidden");
    }
  };

  function copyK() {
    sessionStorage.removeItem(_0x5a2e[6]);
    var k=document.getElementById("k").innerText;
    navigator.clipboard.writeText(k).then(function(){
      alert("تم النسخ بنجاح! سيتم إغلاق الجلسة الآن.");
      window.location.href="raqami://unlock";
    });
  }
</script>
</head>
<body>
  <div class="card hidden" id="v">
    <div class="icon-wrap">💎</div>
    <h1>مفتاح الدخول المعتمد</h1>
    <p class="desc">تم التحقق من هويتك. هذا المفتاح صالح لجلسة واحدة فقط وينتهي عند تحديث الصفحة.</p>
    <div class="key-container">
      <div class="key-label">CURRENT ACCESS KEY</div>
      <div id="k" class="key-value">------</div>
    </div>
    <button class="btn" onclick="copyK()">نسخ المفتاح وتنشيط التطبيق</button>
  </div>

  <div class="card hidden warn-box" id="e">
    <div class="icon-wrap warn-icon">🚫</div>
    <h1 style="color:#ff4b2b">اختراق أمني / انتهاء جلسة</h1>
    <p class="desc">تم رصد محاولة دخول مباشر أو تحديث للصفحة. حرصاً على الأمان، يجب العودة للتطبيق وفتح الرابط المختصر مجدداً.</p>
    <button class="btn" style="background:#222;color:#fff" onclick="window.location.href='raqami://unlock'">العودة للتطبيق</button>
  </div>
</body>
</html>
